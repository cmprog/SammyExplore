# Publishes only the playable game (index.html, src/, lib/) to GitHub Pages.
# Docs, agent configs and playtest tooling stay in the repo but are not served.
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -r src lib _site/
          # The engine's TypeScript reference is a dev aid, not needed at runtime.
          rm -f _site/lib/littlejs/littlejs.d.ts

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
